server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: seatsaarthi-backend

  profiles:
    active: dev

  # JWT Security Configuration
app:
  jwt:
    # 256-bit secret key for HMAC-SHA256 signature
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours

# Swagger / OpenAPI Documentation (Accessible at http://localhost:8080/swagger-ui.html)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator Health Checks
management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# Development Profile (H2 In-Memory)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:seatsaarthidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: SeatSaarthi-H2-HikariCP
      maximum-pool-size: 10
      minimum-idle: 5

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

---
# Production Profile (PostgreSQL)
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/seatsaarthidb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: password
    hikari:
      pool-name: SeatSaarthi-Postgres-HikariCP
      maximum-pool-size: 20
      minimum-idle: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
